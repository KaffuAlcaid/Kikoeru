name: Build Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build portable ZIP
        shell: powershell
        run: .\build-windows-release.ps1

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kikoeru-windows-x64
          path: kikoeru-win-x64-*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-Item -LiteralPath (Get-ChildItem -File "kikoeru-win-x64-*.zip").FullName
          gh release create $env:GITHUB_REF_NAME $zip.FullName --verify-tag --title $env:GITHUB_REF_NAME --generate-notes
